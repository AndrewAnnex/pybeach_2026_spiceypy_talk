          ## What is SpiceyPy (briefly)
          * Open source python wrapper library for NASA JPL SPICE I started in 2014
          * MIT licensed
          * macOS windows linux emscripten (new)
          * Wraps NASA JPL's SPICE toolkit (more on this soon)
          * Supported by NASA PDART grant 80NSSC25K7040

          <a href="https://www.star-history.com/?repos=andrewannex%2Fspiceypy&type=date&releases=&legend=bottom-right">
            <img alt="SpiceyPy GitHub star history" src="images/star_history_spiceypy.png" />
          </a>

          okay, but what is JPL's SPICE toolkit then?
          <!-- .element: class="full-width" -->
          ---
          ## What is SPICE (briefly)
          * Fortran Software Library for NASA scientists and engineers to work with Spacecraft and Planetary Ephemeris information
          * Ephemeris information are the positions and orientations of planets and spacecraft as a function of time.
          * Includes instrument extrinsics (state info) and some intrinsics (focal lengths, coordinate reference frames etc)

          https://naif.jpl.nasa.gov/naif/spiceconcept.html
          ---
          ## What can you do with SPICE (briefly)
          * coordinate, time, and frame conversions
          * lookup/replay NASA mission and planetary ephemeris
            - where was the spacecraft at this date?
            - where was Phobos (a moon) at this date?
          * compute viewing geometry info and occultations
            - when will this asteroid pass in front of this star from this surface point?
            - what is the illumination geometry at this date at this surface point?

          https://naif.jpl.nasa.gov/pub/naif/toolkit_docs/C/info/mostused.html
          ---
          ## Even more about SPICE
          * Originally components date to Voyager mission, but SPICE formalized in early 1980's
          * Developed in F77, translated to C (CSPICE) via f2c
          * JPL provides Fortran, C, Java, IDL, MATLAB interfaces
          * Over 600 individual functions

          https://naif.jpl.nasa.gov/naif/spicehistory.html
          ---
          ## How does SPICE work?

          * Ephemeris data stored in bespoke binary and ascii text files called "kernels"
            - FK (frame kernel), IK (instrument kernel), LSK (leapseconds kernel)
            - SPK (Spacecraft and Planet position kernel), PCK (Planetary orientation kernel), CK (camera pointing kernel)
          * Loads state into kernel pool
            - functionally an in-memory time & kv database

          #### more on this later...
          ---
          ## What else uses or compares to SPICE?

          * JPL Horizons (web/telnet/astropy/astroquery)
            - web-base api, little room for customization
          * JPL MONTE (not open source)

          #### SPICE is not STK/GMAT, lower level tool
          ---
          ## More on SpiceyPy
          * ctypes-based wrapper, 600+ functions from CSPICE
          * readthedocs at spiceypy.readthedocs.io
          * 99% code coverage, CI/CD since 2014
          * new cython submodule (2025)
          * new emscripten distribution (2026) thanks to PEP 783 (more on this later)

          ---
          ## Even more on SpiceyPy
          * custom cmake script for CSPICE shared library
          * cython extension built against same shared library
          * scikit-build-core backend to compile cspice
          * cibuildwheel in ci runners
          * github actions workflow and conda-forge for ci/cd
          * readthedocs and codecov
          * lots and lots of pytests, at least one per function
          ---
          ## SpiceyPy, live in your browser

          * slide deck uses pyodide via pyscript
          * this is actual python code and emscripten compiled CSPICE running client side
          ```python
          import spiceypy as spice
          print(spice.tkvrsn("TOOLKIT"))
          ```
          #### tkvrsn returns the version string of the CSPICE toolkit
          ---
          ## Emscripten? WASM? Pyodide? PEP 783? Wat?

          * Emscripten: compiler toolchain that compiles c/c++ to Wasm/js
          * Wasm: portable binary code your browser can run
          * Pyodide: CPython distribution/interpreter compiled to Wasm
          * PEP 783: pyemscripten tag added for binary Wasm pyodide packages

          With PEP 783 we can host Wasm python wheels on pypi and pip install in the browser!

          <!-- .slide: id="cassini" -->
          ## Demo: Cassini at Saturn
          - load real mission kernels (fetched into the browser)
          - sample 4000 times across 2004–2005
          - Plot Cassini relative to the Saturn barycenter in 3D with matplotlib
          ---
          ## Setup
          A fresh interpreter for this demo, with matplotlib + kernels preloaded:
          ```python
          import numpy as np
          import matplotlib
          matplotlib.use("AGG")
          import matplotlib.pyplot as plt
          from mpl_toolkits.mplot3d import Axes3D
          from pyscript import display
          import spiceypy as spice
          print(f'SpiceyPy for {spice.tkvrsn("TOOLKIT")} ready!')
          ```
          <!-- .element: data-env="cass" data-config="./pyscript_cassini.json" -->
          ---
          ## Load the kernels
          Subset SPICE kernels, fetched from the web into the browser's filesystem:
          ```python
          spice.furnsh([
              'kernels/lsk/naif0008.tls',
              'kernels/sclk/cas00084.tsc',
              'kernels/pck/cpck05Mar2004.tpc',
              'kernels/fk/cas_v37.tf',
              'kernels/ik/cas_iss_v09.ti',
              'kernels/spk/020514_SE_SAT105_s.bsp',
              'kernels/spk/981005_PLTEPH-DE405S_s.bsp',
              'kernels/spk/030201AP_SK_SM546_T45_s.bsp',
          ])
          print(f'Loaded {spice.ktotal("ALL")} kernels')
          ```
          <!-- .element: data-env="cass" -->
          #### furnsh loads kernel files into the kernel pool to populate state info
          ---
          ## Pick a time range
          Convert UTC strings to ephemeris time (seconds past J2000 TDB):
          ```python
          et_one = spice.str2et("Jun 20, 2004")
          et_two = spice.str2et("Dec 1, 2005")
          print(f"ET One: {et_one}, ET Two: {et_two}")
          ```
          <!-- .element: data-env="cass" -->
          #### str2et converts various string time inputs to double precision time in Barycentric Dynamical Time (TDB) seconds past J2000 epoch
          ---
          ## Sample 4000 times (just numpy)
          ```python
          times = np.linspace(et_one, et_two, 4000)
          print(times[0:3])
          ```
          <!-- .element: data-env="cass" -->
          ---
          ## Where was Cassini?
          `spkpos` is vectorized over times — one call, 4000 positions:
          ```python
          positions, light_times = spice.spkpos(
              "Cassini", times, "J2000", "NONE", "SATURN BARYCENTER"
          )
          print("First position (km): ", positions[0])
          print("First light time (s): ", light_times[0])
          ```
          <!-- .element: data-env="cass" -->
          #### spkpos returns the position of a target body relative to an observing body, optionally corrected for light time (planetary aberration) and stellar aberration.
          ---
          <!-- .slide: class="side-by-side" -->
          ## Plot the trajectory
          ```python
          spice.kclear()  # tidy the kernel pool
          positions = positions.T  # -> (3, 4000)
          fig = plt.figure(figsize=(6, 6))
          ax = fig.add_subplot(111, projection="3d")
          ax.plot(*positions)
          ax.set_title("Cassini, 2004 to 2005")
          display(fig, target="mpl", append=False)
          ```
          <!-- .element: data-env="cass" -->
          <div id="mpl"></div>

          #### kclear clears the kernel pool (previous commands if run again would fail)
          <!-- .element: class="full-width" -->

          ## Demo: Mars Perseverance Rover Three Forks Sample Depo


          ---
          ## Load Kernels
          * this may take a few seconds, kernels download in the background...
          ```python
          import numpy as np
          import matplotlib
          matplotlib.use("AGG")
          import matplotlib.pyplot as plt
          from pyscript import display
          import spiceypy as spice
          print('ready!')
          ```
          <!-- .element: data-env="m20" data-config="./pyscript_m20.json" -->
          ---
          ## Define start and end dates and sample points
          ```python
          import os
          # metakernel PATH_VALUES are relative to the working directory
          if os.path.isdir('m20_three_forks_demo'): os.chdir('m20_three_forks_demo')
          # load the metakernel
          spice.furnsh('m2020_v16_221216_230201.tm')
          print(f"We loaded {spice.ktotal('ALL')} Kernel files")
          sol_648 = spice.str2et('2022-12-16')
          sol_693 = spice.str2et('2023-01-31')
          times = np.linspace(sol_648, sol_693, num=45*24*20, endpoint=True)
          print(f"Sampling {len(times)} over 45 sols")
          ```
          <!-- .element: data-env="m20" -->
          #### metakernels are text based kernels containing lists of other kernels
          ---
          ## grab the positions
          ```python
          positions, lttimes = spice.spkpos("M2020", times, "IAU_MARS", "lt+s", "MARS")
          print(f"Successfully grabbed {len(positions)} positions in IAU_MARS frame.")
          # convert from rectangular to latitudinal coordinates (in radians).
          r, lon, lat = np.array([spice.reclat(p) for p in positions]).T
          # convert to degrees
          lon, lat = np.degrees(lon), np.degrees(lat)
          ```
          <!-- .element: data-env="m20" -->
          #### reclat converts points from cartesian coordinates to longitude, latitude, and radius
          ---
          <!-- .slide: class="side-by-side" -->
          ## Plot the Rover's Traverse
          ```python
          fig = plt.figure(figsize=(6, 6))
          ax = fig.add_subplot(111)
          ax.plot(lon, lat)
          ax.scatter(lon, lat, c=times)
          ax.ticklabel_format(useOffset=False, style="plain")
          ax.tick_params(axis="x", labelrotation=45)
          ax.set_xlabel("longitude (°E)"); ax.set_ylabel("latitude (°N)")
          ax.set_title("M20 Rover Traverse Sols 648-693")
          fig.tight_layout()
          display(fig, target="mplm20", append=False)
          ```

          <!-- .slide: id="eclipse" -->
          ## Demo: Eclipses over Santa Monica
          SPICE's geometry finder searches time for *when* something happens.
          Load the Sun, Earth and Moon ephemeris for 2031 through 2033:
          ```python
          import os
          import spiceypy as spice
          spice.furnsh([
              'santa_monica_eclipse/lsk/naif0012.tls',
              'santa_monica_eclipse/pck/pck00010_sun_earth_moon.tpc',
              'santa_monica_eclipse/spk/de438s_2031_2033.bsp',
          ])
          print(f'Loaded {spice.ktotal("ALL")} kernels')
          ```
          <!-- .element: data-env="eclipse" data-config="./pyscript_eclipse.json" -->
          ---
          ## Make Santa Monica Frame Kernel
          Name the site, and give it a topocentric frame (+Z up, +X north), fixed to the Earth:
          ```python
          lon, lat = -118.4912, 34.0195  # Santa Monica, degrees
          spice.boddef('SANTA_MONICA', 399901)
          spice.lmpool([
              "FRAME_SANTA_MONICA_TOPO = 1399901",
              "FRAME_1399901_NAME = 'SANTA_MONICA_TOPO'", "FRAME_1399901_CLASS = 4",
              "FRAME_1399901_CLASS_ID = 1399901", "FRAME_1399901_CENTER = 399901",
              "TKFRAME_1399901_RELATIVE = 'IAU_EARTH'",
              "TKFRAME_1399901_SPEC = 'ANGLES'", "TKFRAME_1399901_UNITS = 'DEGREES'",
              "TKFRAME_1399901_AXES = (3, 2, 3)",
              f"TKFRAME_1399901_ANGLES = ({-lon}, {lat - 90}, 180)",
          ])
          ```
          <!-- .element: data-env="eclipse" -->
          #### boddef defines a body name/int id code pair, lmpool loads strings directly into kernel pool
          ---
          ## ...and an SPK for where it is
          Write the site's position on the Earth's ellipsoid into a new SPK file:
          ```python
          re, _, rp = spice.bodvrd('EARTH', 'RADII', 3)[1]
          site = spice.georec(lon * spice.rpd(), lat * spice.rpd(), 0, re, 1 - rp / re)
          state = [*site, 0, 0, 0]  # fixed to the ground: no velocity in IAU_EARTH
          et0, et1 = spice.str2et('2030 DEC 31'), spice.str2et('2034 JAN 02')
          if os.path.exists('santa_monica.bsp'): os.remove('santa_monica.bsp')
          handle = spice.spkopn('santa_monica.bsp', 'Santa Monica', 0)
          spice.spkw08(handle, 399901, 399, 'IAU_EARTH', et0, et1, 'Santa Monica',
                       1, 2, [state, state], et0, et1 - et0)
          spice.spkcls(handle)
          spice.furnsh('santa_monica.bsp')
          ```
          <!-- .element: data-env="eclipse" -->
          #### georec converts geodetic lon/lat/alt to rectangular coordinates, spkw08 writes a type 8 SPK segment: equally spaced states, Lagrange interpolated
          ---
          ## When is the Moon near the Sun?
          Search 2031 through 2033 for times the Moon is within 2° of the Sun:
          ```python
          search = spice.cell_double(2)
          spice.wninsd(spice.str2et('2031 JAN 01'), spice.str2et('2034 JAN 01'), search)
          close = spice.cell_double(1000)
          spice.gfsep('MOON', 'SPHERE', 'IAU_MOON', 'SUN', 'SPHERE', 'IAU_SUN',
                      'LT', 'SANTA_MONICA', '<', 2 * spice.rpd(), 0.0,
                      spice.spd(), 500, search, close)
          print(f'The Moon passes within 2° of the Sun {spice.wncard(close)} times')
          ```
          <!-- .element: data-env="eclipse" -->
          #### gfsep finds time intervals when the angular separation of two bodies, seen from an observer, satisfies a relation
          ---
          ## When does the Moon block the Sun?
          Search only inside those windows, so this stays fast:
          ```python
          eclipses = spice.cell_double(1000)
          spice.gfoclt('ANY', 'MOON', 'ELLIPSOID', 'IAU_MOON',
                       'SUN', 'ELLIPSOID', 'IAU_SUN',
                       'LT', 'SANTA_MONICA', 180.0, close, eclipses)
          print(f'{spice.wncard(eclipses)} eclipses, day or night')
          ```
          <!-- .element: data-env="eclipse" -->
          #### gfoclt finds time intervals when an observer sees one body occult another ('ANY' = full, annular, or partial)
          ---
          ## ...while the Sun is up?
          Elevation is latitude in the site's topocentric frame (+Z up, +X north):
          ```python
          from zoneinfo import ZoneInfo
          pacific = ZoneInfo('America/Los_Angeles')
          visible = spice.cell_double(1000)
          # when the latitude > 0 with respect to santa monica the sun is above the horizon
          spice.gfposc('SUN', 'SANTA_MONICA_TOPO', 'LT+S', 'SANTA_MONICA',
                       'LATITUDINAL', 'LATITUDE', '>', 0.0, 0.0,
                       3600.0, 500, eclipses, visible)
          for i in range(spice.wncard(visible)):
              times = spice.et2datetime(spice.wnfetd(visible, i))
              start, end = [t.astimezone(pacific) for t in times]
              print(f'{start:%a %b %d %Y, %I:%M %p} to {end:%I:%M %p %Z}')
          ```
          <!-- .element: data-env="eclipse" -->
          #### gfposc finds when one coordinate of an observer-target vector meets a constraint
          ---
          <!-- .slide: class="side-by-side refs-slide" -->
          ## When is each eclipse deepest?
          The peak is when the Sun and Moon are closest together:
          <!-- .element: class="full-width" -->
          ```python
          for i in range(spice.wncard(visible)):
              eclipse = spice.cell_double(2)
              spice.wninsd(*spice.wnfetd(visible, i), eclipse)
              peak = spice.cell_double(2)
              spice.gfsep('MOON', 'SPHERE', 'IAU_MOON', 'SUN', 'SPHERE', 'IAU_SUN',
                          'LT+S', 'SANTA_MONICA', 'ABSMIN', 0.0, 0.0,
                          60.0, 1, eclipse, peak)
              when = spice.et2datetime(spice.wnfetd(peak, 0)[0]).astimezone(pacific)
              print(f'peak at {when:%a %b %d %Y, %I:%M:%S %p %Z}')
          spice.kclear()  # tidy the kernel pool
          ```

    <script>
      // Promotes ```python fences to runnable PyScript editors. Runs between
      // RevealMarkdown (needs the rendered <pre><code>) and RevealHighlight
      // (skips blocks meant to stay static highlighted code). Opt out of
      // promotion per-block with <!-- .element: class="static" --> or by
      // using [line-number] annotations.
      const PyScriptPromote = {
        id: 'pyscript-promote',
        init(deck) {
          const configured = new Set();
          // reveal's markdown renderer emits <code class="python">, plain marked
          // emits <code class="language-python"> — accept either
          deck.getSlidesElement().querySelectorAll('pre > code.python, pre > code.language-python').forEach(code => {
            const pre = code.parentElement;
            if (pre.classList.contains('static') ||
                pre.hasAttribute('data-line-numbers') ||
                code.hasAttribute('data-line-numbers')) return;
            const env = pre.getAttribute('data-env') || 'demo';
            const editor = document.createElement('script');
            editor.setAttribute('type', 'py-editor');
            editor.setAttribute('env', env);
            if (!configured.has(env)) {
              editor.setAttribute('config', pre.getAttribute('data-config') || './pyscript.json');
              configured.add(env);
            }
            editor.textContent = code.textContent;
            const wrapper = document.createElement('div');
            wrapper.className = 'pyscript-demo';
            wrapper.appendChild(editor);
            pre.replaceWith(wrapper);
          });

          // CodeMirror renders inside a shadow root, out of reach of page CSS,
          // so inject a monokai theme + gutter hiding into each editor's shadow
          // root as PyScript mounts them. The .ͼx token classes are generated
          // names, stable for a pinned PyScript release — remap them if the
          // core.js version above ever changes.
          const EDITOR_THEME_CSS = `
            .cm-gutters { display: none !important; }
            .cm-editor { background: #272822 !important; color: #f8f8f2 !important; }
            .cm-editor .cm-content { caret-color: #f8f8f2; }
            .cm-editor .cm-cursor { border-left-color: #f8f8f2 !important; }
            .cm-editor .cm-activeLine { background: rgba(255,255,255,.06) !important; }
            .cm-editor .cm-selectionBackground { background: rgba(255,255,255,.25) !important; }
            .ͼb { color: #f92672 !important; }              /* keywords */
            .ͼe, .ͼf { color: #e6db74 !important; }    /* strings, f-strings */
            .ͼd, .ͼc { color: #ae81ff !important; }    /* numbers, True/False */
            .ͼm { color: #75715e !important; }              /* comments */
            .ͼg, .ͼj { color: #a6e22e !important; }    /* def/class names */
          `;
          const themeEditors = () => {
            document.querySelectorAll('py-editor *').forEach(el => {
              if (el.shadowRoot && !el.shadowRoot.querySelector('style.monokai-theme')) {
                const style = document.createElement('style');
                style.className = 'monokai-theme';
                style.textContent = EDITOR_THEME_CSS;
                el.shadowRoot.appendChild(style);
              }
            });
          };
          // Run feedback: pulse the editor and show a live timer while a cell runs
          // (PyScript toggles .running on the run button), then "ran in X". The first
          // run in an env includes Python startup, so say so.
          const startedEnvs = new Set();
          const fmtMs = ms => ms < 1000 ? `${Math.round(ms)} ms` : `${(ms / 1000).toFixed(2)} s`;
          const timeRuns = () => {
            document.querySelectorAll('.pyscript-demo .py-editor-run-button:not([data-timed])').forEach(btn => {
              btn.dataset.timed = '1';
              const wrapper = btn.closest('.pyscript-demo');
              const env = wrapper.querySelector('py-editor')?.getAttribute('env');
              const status = document.createElement('div');
              status.className = 'cell-status';
              wrapper.appendChild(status);
              let t0 = 0, tick = 0, cold = false;
              new MutationObserver(() => {
                const running = btn.classList.contains('running');
                if (running && !t0) {
                  t0 = performance.now();
                  cold = !startedEnvs.has(env);
                  startedEnvs.add(env);
                  wrapper.classList.add('is-running');
                  status.className = 'cell-status running';
                  const draw = () => status.textContent =
                    `running… ${fmtMs(performance.now() - t0)}${cold ? ' (starting Python)' : ''}`;
                  draw();
                  tick = setInterval(draw, 100);
                } else if (!running && t0) {
                  clearInterval(tick);
                  const ms = performance.now() - t0;
                  t0 = 0;
                  wrapper.classList.remove('is-running');
                  const out = wrapper.querySelector('.py-editor-output')?.textContent ?? '';
                  const failed = /Traceback \(most recent call last\)|^\w+Error:/m.test(out);
                  status.className = `cell-status ${failed ? 'failed' : 'done'}`;
                  status.textContent = `${failed ? '✗ failed after' : '✓ ran in'} ${fmtMs(ms)}` +
                    (cold ? ' (incl. Python startup)' : '');
                  deck.layout();
                }
              }).observe(btn, { attributes: true, attributeFilter: ['class'] });
            });
          };
          new MutationObserver(() => {
            themeEditors();
            timeRuns();
            // slides are vertically centered before any plot output exists, so
            // re-run reveal's layout when an image lands in an output div
            document.querySelectorAll('.slides img:not([data-relayout])').forEach(img => {
              img.dataset.relayout = '1';
              img.addEventListener('load', () => deck.layout());
              if (img.complete) deck.layout();
            });
            // same problem for the editors themselves: a cell mounts taller than the
            // <pre> it replaced, and reveal keeps the pre-mount centering until the
            // next slide change — deep-linking to a cell slide would clip the bottom
            document.querySelectorAll('.py-editor-box:not([data-relayout])').forEach(box => {
              box.dataset.relayout = '1';
              deck.layout();
            });
          }).observe(document.body, { childList: true, subtree: true });
          themeEditors();
        }
      };
      // Smart space: on a slide with an editor that hasn't run yet, space runs
      // it (each press runs the next unrun editor); once they've all been run,
      // space advances as usual. Arrow keys always just navigate. A running
      // cell doesn't block advancing — the worker keeps computing off-slide.
      // Any click on a run button (mouse or synthetic) marks that editor as run.
      document.addEventListener('click', e => {
        const btn = e.target.closest?.('.py-editor-run-button');
        if (btn) btn.closest('.py-editor-box').dataset.ran = '1';
      }, true);
      Reveal.initialize({
        plugins: [RevealMarkdown, PyScriptPromote, RevealHighlight],
        hash: true,
        width: 1280,   // 16:9 slide area; reveal's default is 960x700
        height: 720,
        keyboard: {
          32: event => {
            if (event && event.shiftKey) { Reveal.prev(); return; }
            const pending = [...Reveal.getCurrentSlide().querySelectorAll('.py-editor-box')]
              .find(box => !box.dataset.ran);
            if (pending) pending.querySelector('.py-editor-run-button').click();
            else Reveal.next();
          },
        },
      });
    </script>
  </body>
</html>
